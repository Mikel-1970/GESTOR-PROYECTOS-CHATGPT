name: Avisos INGITECH manuales seguros

on:
  workflow_dispatch:
    inputs:
      status:
        description: Estado
        required: true
        type: choice
        options:
          - ERROR
          - REQUIERE REVISIÓN
          - REQUIERE APROBACIÓN
      version:
        description: Versión o revisión
        required: false
        type: string
      summary:
        description: Resumen breve
        required: true
        type: string
      validation_detail:
        description: Detalle o evidencia disponible
        required: false
        type: string
      action_required:
        description: Acción requerida
        required: false
        type: string
      app_url:
        description: Enlace opcional
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  notify:
    uses: Mikel-1970/CURSO-IA-CHAT-GPT/.github/workflows/notify-event-central.yml@main
    with:
      project: GESTOR-PROYECTOS-CHATGPT
      process: gestión de proyecto
      status: ${{ inputs.status }}
      version: ${{ inputs.version }}
      summary: ${{ inputs.summary }}
      validation_detail: ${{ inputs.validation_detail }}
      action_required: ${{ inputs.action_required }}
      app_url: ${{ inputs.app_url }}
